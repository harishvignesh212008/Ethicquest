<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETHIC QUEST — Electoral Malpractices &amp; Tax Evasion</title>

  <!-- Google Fonts: Space Grotesk (Headings), Inter (Body), JetBrains Mono (IDs & Timers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       1. DESIGN TOKENS & BRAND SYSTEM (ETHIC QUEST — 3-GAME EDITION)
       ========================================================================= */
    :root {
      --bg-midnight: #07101F;
      --bg-panel: #101D32;
      --bg-panel-glass: rgba(16, 29, 50, 0.85);
      --bg-raised: #152640;
      --bg-raised-hover: #1C3254;

      --accent-blue: #4C8DFF;
      --accent-violet: #9B72FF;
      --accent-mint: #42E6C4;
      --accent-amber: #FFB84D;
      --accent-coral: #FF647C;

      --text-primary: #E8EFFB;
      --text-muted: #9AAAC2;
      --text-dark: #07101F;

      --border-subtle: rgba(154, 170, 194, 0.16);
      --border-strong: rgba(154, 170, 194, 0.30);

      --radius-panel: 22px;
      --radius-card: 18px;
      --radius-control: 13px;
      --radius-pill: 999px;

      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

      --max-width: 1180px;
      --transition-fast: 180ms cubic-bezier(0.22, 1, 0.36, 1);
      --transition-med: 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-midnight);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      /* Subtle futuristic blueprint grid + soft ambient radial lighting */
      background-image:
        radial-gradient(circle at 14% 8%, rgba(76, 141, 255, 0.11), transparent 40%),
        radial-gradient(circle at 86% 14%, rgba(155, 114, 255, 0.10), transparent 42%),
        linear-gradient(rgba(154, 170, 194, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(154, 170, 194, 0.045) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
      background-attachment: fixed;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.15;
    }

    .mono {
      font-family: var(--font-mono);
    }

    :focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================================================
       2. LAYOUT SHELL & FIXED TOP NAVIGATION BAR
       ========================================================================= */
    .app-shell {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 18px 20px 72px;
    }

    .nav-wrapper {
      position: sticky;
      top: 14px;
      z-index: 100;
      margin-bottom: 34px;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(13, 24, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 10px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text-primary);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      border-radius: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-blue), #326EE6);
      color: var(--text-dark);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px rgba(76, 141, 255, 0.45);
      flex-shrink: 0;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .nav-link {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.84rem;
      letter-spacing: 0.06em;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: color var(--transition-fast), background var(--transition-fast);
    }

    .nav-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-link.active {
      color: var(--accent-mint);
      text-shadow: 0 0 14px rgba(66, 230, 196, 0.45);
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 3px;
      height: 2px;
      border-radius: 99px;
      background: var(--accent-mint);
      box-shadow: 0 0 10px rgba(66, 230, 196, 0.7);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sound-btn {
      background: var(--bg-raised);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .sound-btn:hover {
      border-color: var(--accent-blue);
      color: var(--text-primary);
    }

    .sound-btn.sound-on {
      color: var(--accent-mint);
      border-color: rgba(66, 230, 196, 0.35);
    }

    .player-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-raised);
      border: 1px solid rgba(255, 184, 77, 0.32);
      color: var(--accent-amber);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 8px 14px;
      border-radius: 11px;
      cursor: pointer;
      transition: all var(--transition-fast);
      max-width: 170px;
    }

    .player-badge span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-badge:hover {
      background: var(--bg-raised-hover);
      border-color: var(--accent-amber);
      box-shadow: 0 0 14px rgba(255, 184, 77, 0.22);
    }

    .mobile-menu-btn {
      display: none;
      background: var(--bg-raised);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      width: 40px;
      height: 40px;
      border-radius: 11px;
      place-items: center;
      cursor: pointer;
    }

    .mobile-dropdown {
      display: none;
      margin-top: 10px;
      background: rgba(16, 29, 50, 0.96);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .mobile-dropdown.open {
      display: flex;
    }

    .mobile-dropdown .nav-link {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      font-size: 0.92rem;
    }

    /* =========================================================================
       3. SHARED COMPONENTS: PANELS, CARDS, PILLS, BUTTONS, PROGRESS BARS
       ========================================================================= */
    .page-view {
      animation: fadeSlideIn 260ms ease-out;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-header {
      margin-bottom: 26px;
    }

    .page-title {
      font-size: clamp(1.85rem, 3.6vw, 2.55rem);
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 1.02rem;
      max-width: 720px;
    }

    .panel {
      background: var(--bg-panel-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-panel);
      padding: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .card {
      background: var(--bg-panel-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 24px;
      position: relative;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
    }

    .card-interactive {
      cursor: pointer;
    }

    .card-interactive:hover {
      transform: translateY(-2px);
      border-color: rgba(76, 141, 255, 0.48);
      box-shadow: 0 12px 28px rgba(76, 141, 255, 0.12);
    }

    .card-accent-left {
      padding-left: 28px;
    }

    .card-accent-left::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 18px;
      bottom: 18px;
      width: 4px;
      border-radius: 99px;
      background: var(--card-accent, var(--accent-blue));
      box-shadow: 0 0 12px var(--card-accent, var(--accent-blue));
    }

    /* Pills & Badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
    }

    .pill-blue { background: rgba(76, 141, 255, 0.14); color: var(--accent-blue); border-color: rgba(76, 141, 255, 0.30); }
    .pill-violet { background: rgba(155, 114, 255, 0.14); color: var(--accent-violet); border-color: rgba(155, 114, 255, 0.30); }
    .pill-mint { background: rgba(66, 230, 196, 0.14); color: var(--accent-mint); border-color: rgba(66, 230, 196, 0.30); }
    .pill-amber { background: rgba(255, 184, 77, 0.14); color: var(--accent-amber); border-color: rgba(255, 184, 77, 0.30); }
    .pill-coral { background: rgba(255, 100, 124, 0.14); color: var(--accent-coral); border-color: rgba(255, 100, 124, 0.32); }

    .pill-solid-blue { background: var(--accent-blue); color: var(--text-dark); }
    .pill-solid-violet { background: var(--accent-violet); color: var(--text-dark); }
    .pill-solid-mint { background: var(--accent-mint); color: var(--text-dark); }
    .pill-solid-amber { background: var(--accent-amber); color: var(--text-dark); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 13px 22px;
      border-radius: var(--radius-control);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-height: 46px;
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: var(--text-dark);
      box-shadow: 0 6px 20px rgba(76, 141, 255, 0.32);
    }

    .btn-primary:hover:not(:disabled) {
      background: #679FFF;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(76, 141, 255, 0.45);
    }

    .btn-violet {
      background: var(--accent-violet);
      color: var(--text-dark);
      box-shadow: 0 6px 20px rgba(155, 114, 255, 0.30);
    }

    .btn-violet:hover:not(:disabled) {
      background: #AE8BFF;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(155, 114, 255, 0.44);
    }

    .btn-mint {
      background: var(--accent-mint);
      color: var(--text-dark);
      box-shadow: 0 6px 20px rgba(66, 230, 196, 0.28);
    }

    .btn-mint:hover:not(:disabled) {
      background: #64F0D2;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-raised);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-raised-hover);
      border-color: var(--accent-blue);
    }

    .btn-coral-outline {
      background: rgba(255, 100, 124, 0.08);
      color: var(--accent-coral);
      border-color: rgba(255, 100, 124, 0.45);
    }

    .btn-coral-outline:hover:not(:disabled) {
      background: rgba(255, 100, 124, 0.18);
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 11px;
      background: var(--bg-raised);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(154, 170, 194, 0.12);
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent-blue);
      transition: width 450ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .split-main {
      display: grid;
      grid-template-columns: minmax(0, 1.85fr) minmax(280px, 1fr);
      gap: 22px;
      align-items: start;
    }

    /* =========================================================================
       4. HOME PAGE STYLES
       ========================================================================= */
    .hero-panel {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.85fr);
      gap: 28px;
      align-items: center;
      border-color: rgba(76, 141, 255, 0.34);
      box-shadow: 0 0 40px rgba(76, 141, 255, 0.08), 0 18px 40px rgba(0, 0, 0, 0.35);
      margin-bottom: 28px;
      padding: 36px;
    }

    .hero-display {
      font-size: clamp(2.2rem, 5vw, 3.55rem);
      line-height: 1.04;
      margin: 18px 0 14px;
      letter-spacing: -0.025em;
    }

    .hero-sub {
      color: var(--text-muted);
      font-size: 1.06rem;
      margin-bottom: 24px;
    }

    .motif-card {
      background: rgba(11, 21, 38, 0.88);
      border: 1px solid rgba(155, 114, 255, 0.40);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: inset 0 0 30px rgba(155, 114, 255, 0.08);
    }

    .motif-kicker {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .motif-title {
      font-size: 1.75rem;
      letter-spacing: 0.04em;
      margin-bottom: 22px;
    }

    /* 3 Glowing Color Pills for the 3-Game Architecture */
    .motif-pills {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .motif-pill {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: var(--text-dark);
      transition: transform var(--transition-fast);
    }

    .motif-pill:hover {
      transform: translateY(-3px) scale(1.05);
    }

    .motif-caption {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    /* =========================================================================
       5. ARENA & SELECTABLE ANSWER ROWS
       ========================================================================= */
    .arena-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 265px;
    }

    .arena-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .arena-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }

    .option-row {
      width: 100%;
      text-align: left;
      background: var(--bg-raised);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-control);
      padding: 16px 18px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.98rem;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .option-row:hover:not(:disabled) {
      background: var(--bg-raised-hover);
      border-color: rgba(76, 141, 255, 0.55);
    }

    .option-row.selected {
      background: rgba(76, 141, 255, 0.14);
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 1px rgba(76, 141, 255, 0.35);
    }

    .option-row.correct {
      background: rgba(66, 230, 196, 0.12);
      border-color: var(--accent-mint);
    }

    .option-row.incorrect {
      background: rgba(255, 100, 124, 0.12);
      border-color: var(--accent-coral);
    }

    .option-key {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.85rem;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .option-row.selected .option-key { background: var(--accent-blue); color: var(--text-dark); }
    .option-row.correct .option-key { background: var(--accent-mint); color: var(--text-dark); }
    .option-row.incorrect .option-key { background: var(--accent-coral); color: var(--text-dark); }

    .option-status {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      padding-left: 8px;
    }

    .feedback-box {
      border-radius: 14px;
      padding: 18px 20px;
      margin-top: 18px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-raised);
    }

    .feedback-box.is-correct {
      border-color: rgba(66, 230, 196, 0.45);
      background: rgba(66, 230, 196, 0.08);
    }

    .feedback-box.is-wrong {
      border-color: rgba(255, 100, 124, 0.45);
      background: rgba(255, 100, 124, 0.08);
    }

    .feedback-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 6px;
    }

    /* Form Controls */
    .field-label {
      display: block;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .text-input, .text-area {
      width: 100%;
      background: var(--bg-raised);
      border: 1.5px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.94rem;
      padding: 13px 15px;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .text-area {
      min-height: 110px;
      resize: vertical;
    }

    .text-input:focus, .text-area:focus {
      outline: none;
      border-color: var(--accent-violet);
      box-shadow: 0 0 0 3px rgba(155, 114, 255, 0.20);
    }

    /* =========================================================================
       6. GAME 2: ETHICAL DETECTIVE (VIOLET ACCENT)
       ========================================================================= */
    .witness-drawer {
      background: rgba(11, 21, 38, 0.92);
      border: 1px solid rgba(155, 114, 255, 0.35);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 26px;
      animation: fadeSlideIn 220ms ease-out;
    }

    .witness-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .witness-tab {
      background: var(--bg-raised);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .witness-tab:hover {
      border-color: rgba(155, 114, 255, 0.55);
      color: var(--text-primary);
    }

    .witness-tab.active {
      background: rgba(155, 114, 255, 0.18);
      border-color: var(--accent-violet);
      color: var(--text-primary);
      box-shadow: 0 0 14px rgba(155, 114, 255, 0.22);
    }

    .witness-quote {

  <script>
    /* =========================================================================

    // -------------------------------------------------------------------------
    // 1. WEB AUDIO API SOUND EFFECTS (Zero external audio files)
    // -------------------------------------------------------------------------
    const SoundFX = (() => {
      let ctx = null;
      let enabled = true;

      function init() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
      }

      function playTone(freq, duration, type = 'sine', volume = 0.075, delay = 0) {
        if (!enabled) return;
        try {
          init();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + delay + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + duration + 0.02);
        } catch (e) {
          // Audio context unavailable
        }
      }

      return {
        toggle() {
          enabled = !enabled;
          if (enabled) this.click();
          return enabled;
        },
        click() { playTone(540, 0.06, 'triangle', 0.05); },
        select() { playTone(660, 0.08, 'sine', 0.06); },
        clue() {
          playTone(523.25, 0.12, 'triangle', 0.07, 0);
          playTone(783.99, 0.18, 'triangle', 0.07, 0.08);
        },
        correct() {
          playTone(587.33, 0.12, 'sine', 0.08, 0);
          playTone(880.00, 0.22, 'sine', 0.08, 0.09);
        },
        wrong() {
          playTone(260, 0.15, 'sawtooth', 0.05, 0);
          playTone(200, 0.22, 'sawtooth', 0.05, 0.11);
        },
        tick(urgent = false) {
          playTone(urgent ? 880 : 440, 0.04, 'square', urgent ? 0.04 : 0.02);
        },
        complete() {
          playTone(523.25, 0.13, 'triangle', 0.08, 0);
          playTone(659.25, 0.13, 'triangle', 0.08, 0.10);
          playTone(783.99, 0.15, 'triangle', 0.08, 0.20);
          playTone(1046.50, 0.28, 'triangle', 0.09, 0.30);
        }
      };
    })();

    // -------------------------------------------------------------------------

    const ELECTION_SCENARIOS = [

    const DETECTIVE_CASE = {

    const ETHICS_CHALLENGE_QUESTIONS = [

        const raw = localStorage.getItem(STORAGE_KEY);

            playerName: parsed.playerName || 'PLAYER',
            scores: {

              challenge: parsed.scores?.challenge ?? null

      }
      return {
        playerName: 'PLAYER',
        scores: { election: null, detective: null, challenge: null },
        reflection: ''
      };
    }

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState.persistent));

        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

      const el = document.createElement('div');
      el.className = `toast ${type === 'warn' ? 'toast-warn' : type === 'error' ? 'toast-error' : ''}`;
      const icon = type === 'error' ? '⚠' : type === 'warn' ? '⚡' : '✓';
      el.innerHTML = `<span style="font-weight:700;">${icon}</span><span>${escapeHTML(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        el.style.transition = 'all 220ms ease';
        setTimeout(() => el.remove(), 240);
      }, 3000);
    }

      const activeTop = ['home', 'about', 'arena', 'profile'].includes(AppState.route)

      document.querySelectorAll('.nav-link').forEach(btn => {

    function bindGame2Events() {
      const g2 = AppState.g2;

      if (g2.step === 'report') {

          finishGame('detective', 'Ethical Detective (Case 01)', rd.score, {
            well: rd.correctSuspect
              ? 'You gathered all three clues, saw past the volunteer red herring, and accurately held Candidate A accountable.'
              : 'You systematically collected all three clues before submitting your verdict.',
            improve: rd.reasonPts >= 24
              ? 'Your written reasoning clearly linked the off-book cash receipt, witness corroboration, and encrypted blackout message.'
              : 'Strengthen written justifications by explicitly citing specific clues—such as the tax-evaded shell printer receipt, courier meeting, and encrypted chat.',
            principle: 'Accountability requires verified, corroborated evidence—connecting financial tax trails with electoral rules rather than relying on rumours.'
          });
        });
        return;
      }

      if (g2.step === 'decide') {
        document.getElementById('g2BackToCaseBtn').addEventListener('click', () => {
          SoundFX.click();
          g2.reasoning = document.getElementById('g2ReasonInput').value;
          g2.step = 'case';
          render();
        });

        document.querySelectorAll('[data-suspect]').forEach(btn => {
          btn.addEventListener('click', () => {
            SoundFX.select();
            g2.reasoning = document.getElementById('g2ReasonInput').value;
            g2.selectedSuspect = btn.dataset.suspect;
            render();
          });
        });

        document.getElementById('g2SubmitCaseBtn').addEventListener('click', () => {
          const reason = document.getElementById('g2ReasonInput').value.trim();
          g2.reasoning = reason;
          if (!g2.selectedSuspect) {
            SoundFX.wrong();
            showToast('Please select who is responsible.', 'warn');
            return;
          }
          if (reason.length < 15) {
            SoundFX.wrong();
            showToast('Please explain your reasoning using the clues (at least 15 characters).', 'warn');
            return;
          }

          // Real Scoring Logic (100 pts total):
          // - 30 pts for collecting all 3 clues (10 each)
          // - 40 pts for identifying Candidate A
          // - Up to 30 pts for evidence-based written reasoning
          const cluePts = Object.values(g2.unlockedClues).filter(Boolean).length * 10;
          const correctSuspect = g2.selectedSuspect === DETECTIVE_CASE.correctSuspect;
          const verdictPts = correctSuspect ? 40 : 0;

          const lower = reason.toLowerCase();
          const keywords = ['cash', 'tax', 'printer', 'message', 'chat', 'meeting', 'rule', 'blackout', 'receipt', 'gst', 'courier', 'shell', 'witness', 'clue', 'bank', '48', 'flyer', 'volunteer'];
          const matches = keywords.filter(k => lower.includes(k)).length;
          let reasonPts = 10;
          if (matches >= 3 || reason.length >= 90) reasonPts = 30;
          else if (matches >= 2 || reason.length >= 50) reasonPts = 24;
          else if (matches >= 1) reasonPts = 18;

          const score = Math.min(100, cluePts + verdictPts + reasonPts);
          g2.reportData = { score, cluePts, verdictPts, reasonPts, correctSuspect };
          g2.step = 'report';
          SoundFX.complete();
          render();
        });
        return;
      }

      // Case Board interactions
      document.getElementById('g2ToggleWitnessBtn').addEventListener('click', () => {
        SoundFX.click();
        g2.witnessOpen = !g2.witnessOpen;
        if (g2.witnessOpen) g2.inspectedWitnesses[g2.activeWitness] = true;
        render();
      });

      document.querySelectorAll('[data-witness]').forEach(tab => {
        tab.addEventListener('click', () => {
          SoundFX.select();
          g2.activeWitness = tab.dataset.witness;
          g2.inspectedWitnesses[g2.activeWitness] = true;

      document.querySelectorAll('[data-unlock]').forEach(btn => {

          SoundFX.click();
          g2.step = 'decide';
          render();
        });

    }

        g3.timerId = setInterval(() => {

          if (digits) digits.textContent = `00:${String(Math.max(0, g3.timeLeft)).padStart(2, '0')}`;

    // --- 8. FINAL ETHICAL PROFILE (TOTAL / 300 + 3-AXIS TRIANGLE RADAR) ---
    function buildTriangleRadarSVG(scores) {
      // 3-Axis Equilateral Triangle Radar:
      // Top (-90°): Election Integrity (Blue)
      // Bottom-Right (30°): Ethical Detective (Violet)
      // Bottom-Left (150°): Ethics Challenge (Mint)
      const cx = 150, cy = 152, maxR = 96;
      const v1 = Math.max(0.06, (scores.election || 0) / 100);
      const v2 = Math.max(0.06, (scores.detective || 0) / 100);
      const v3 = Math.max(0.06, (scores.challenge || 0) / 100);

      const pt = (val, angleDeg) => {
        const rad = (angleDeg * Math.PI) / 180;
        return [cx + Math.cos(rad) * maxR * val, cy + Math.sin(rad) * maxR * val];
      };

      const p1 = pt(v1, -90);
      const p2 = pt(v2, 30);
      const p3 = pt(v3, 150);
      const polyPoints = `${p1[0]},${p1[1]} ${p2[0]},${p2[1]} ${p3[0]},${p3[1]}`;

      const ring = r => {
        const a = pt(r, -90), b = pt(r, 30), c = pt(r, 150);
        return `<polygon points="${a[0]},${a[1]} ${b[0]},${b[1]} ${c[0]},${c[1]}" fill="none" stroke="rgba(154,170,194,0.22)" stroke-width="1" />`;
      };

      const top = pt(1, -90), br = pt(1, 30), bl = pt(1, 150);

      return `
        <svg viewBox="0 0 300 280" width="280" height="262" role="img" aria-label="3-Axis Ethical Competency Triangle Radar Chart">
          ${ring(0.25)}${ring(0.5)}${ring(0.75)}${ring(1)}
          <line x1="${cx}" y1="${cy}" x2="${top[0]}" y2="${top[1]}" stroke="rgba(154,170,194,0.24)" />
          <line x1="${cx}" y1="${cy}" x2="${br[0]}" y2="${br[1]}" stroke="rgba(154,170,194,0.24)" />
          <line x1="${cx}" y1="${cy}" x2="${bl[0]}" y2="${bl[1]}" stroke="rgba(154,170,194,0.24)" />

          <polygon points="${polyPoints}" fill="rgba(66,230,196,0.22)" stroke="#42E6C4" stroke-width="2.5" stroke-linejoin="round" />
          <circle cx="${p1[0]}" cy="${p1[1]}" r="5" fill="#4C8DFF" />
          <circle cx="${p2[0]}" cy="${p2[1]}" r="5" fill="#9B72FF" />
          <circle cx="${p3[0]}" cy="${p3[1]}" r="5" fill="#42E6C4" />

          <text x="${cx}" y="38" text-anchor="middle" fill="#4C8DFF" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">ELECTION INTEGRITY</text>
          <text x="236" y="230" text-anchor="middle" fill="#9B72FF" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">DETECTIVE</text>
          <text x="64" y="230" text-anchor="middle" fill="#42E6C4" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">CHALLENGE</text>
        </svg>
      `;
    }

    function renderProfile() {
      const s = AppState.persistent.scores;
      const total = (s.election || 0) + (s.detective || 0) + (s.challenge || 0);
      const completedCount = [s.election, s.detective, s.challenge].filter(v => v !== null).length;

      let rankTitle = 'NEW CHALLENGER';
      let rankDesc = 'Complete all three challenges in the Game Arena to build your complete 300-point Ethical Profile.';
      if (total >= 260) {
        rankTitle = 'ETHICAL GUARDIAN';
        rankDesc = 'Exceptional mastery of electoral fairness, tax integrity, and evidence-based moral reasoning.';
      } else if (total >= 200) {
        rankTitle = 'ETHICAL THINKER';
        rankDesc = 'A strong, principled snapshot of your decisions, evidence evaluation, and civic reflection.';
      } else if (total >= 110) {
        rankTitle = 'DEVELOPING INVESTIGATOR';
        rankDesc = 'Solid progress across ethical dilemmas. Replay unfinished or lower-scoring challenges to sharpen your skills.';
      }

      const rows = [
        { name: '01 Election Integrity', val: s.election, color: 'var(--accent-blue)' },
        { name: '02 Ethical Detective', val: s.detective, color: 'var(--accent-violet)' },
        { name: '03 Ethics Challenge', val: s.challenge, color: 'var(--accent-mint)' }
      ];

      return `
        <section class="page-view">
          <div class="print-banner">
            <h2>ETHIC QUEST — Ethics Lab Assessment Report</h2>
            <p>Topic: Electoral Malpractices &amp; Tax Evasion | Student: ${escapeHTML(AppState.persistent.playerName)} | Date: ${new Date().toLocaleDateString()}</p>
          </div>

          <div class="page-header">
            <h1 class="page-title">YOUR ETHICAL PROFILE</h1>
            <p class="page-subtitle">A combined view of your progress across all three games (${completedCount} of 3 completed).</p>
          </div>

          <div class="panel" style="margin-bottom:22px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;">
              <div>
                <div class="mono" style="font-size:0.78rem; color:var(--text-muted); letter-spacing:0.08em; margin-bottom:6px;">
                  FINAL ETHICAL PROFILE &bull; ${escapeHTML(AppState.persistent.playerName)}
                </div>
                <h2 style="font-size:clamp(1.8rem, 4vw, 2.5rem); margin-bottom:8px;">${rankTitle}</h2>
                <p style="color:var(--text-muted); max-width:540px;">${rankDesc}</p>
              </div>
              <div style="text-align:right;">
                <div class="mono" style="font-size:0.78rem; color:var(--text-muted); letter-spacing:0.08em; margin-bottom:4px;">TOTAL SCORE</div>
                <div style="display:flex; align-items:baseline; gap:8px; justify-content:flex-end;">
                  <span class="score-hero-num">${total}</span>
                  <span style="color:var(--text-muted); font-size:1.2rem;">/ 300</span>
                </div>
              </div>
            </div>
          </div>

          <div class="grid-3" style="margin-bottom:22px;">
            ${rows.map(r => `
              <div class="card" style="padding:20px 22px;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px;">
                  <strong style="font-size:1.02rem;">${r.name}</strong>
                  <span class="mono" style="color:${r.color}; font-weight:700; font-size:0.9rem;">
                    ${r.val !== null ? `${r.val} / 100` : 'Not Played'}
                  </span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" style="width:${r.val || 0}%; background:${r.color};"></div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="split-main" style="margin-bottom:24px;">
            <div class="panel">
              <h3 style="font-size:1.2rem; margin-bottom:8px;">Personal Ethical Reflection</h3>
              <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:14px;">
                How do tax evasion and undeclared black money fuel electoral malpractices? Write a brief reflection for your lab submission:
              </p>
              <textarea id="profileReflectionInput" class="text-area" placeholder="Write your ethical reflection here (saved automatically)...">${escapeHTML(AppState.persistent.reflection || '')}</textarea>
              <div style="margin-top:12px; display:flex; justify-content:flex-end;" class="no-print">
                <button class="btn btn-secondary" id="saveReflectionBtn" style="padding:9px 16px; min-height:40px; font-size:0.82rem;">SAVE REFLECTION</button>
              </div>
            </div>

            <div class="panel radar-wrap">
              <div class="mono" style="font-size:0.76rem; color:var(--text-muted); letter-spacing:0.08em; margin-bottom:6px;">3-AXIS ETHICAL RADAR</div>
              ${buildTriangleRadarSVG(s)}
            </div>
          </div>

          <div style="display:flex; gap:14px; flex-wrap:wrap;" class="no-print">
            <button class="btn btn-primary" id="printReportBtn">PRINT / SAVE LAB REPORT</button>
            <button class="btn btn-secondary" id="profileArenaBtn">RETURN TO GAME ARENA</button>
            <button class="btn btn-coral-outline" id="resetProgressBtn">RESET PROGRESS</button>
          </div>
        </section>
      `;
    }

    function bindProfileEvents() {
      const refInput = document.getElementById('profileReflectionInput');
      const saveRef = () => {
        AppState.persistent.reflection = refInput.value;
        saveState();
      };
      refInput.addEventListener('blur', saveRef);
      document.getElementById('saveReflectionBtn').addEventListener('click', () => {
        saveRef();
        SoundFX.correct();
        showToast('Reflection saved to your Ethical Profile.');
      });

      document.getElementById('printReportBtn').addEventListener('click', () => {
        saveRef();
        SoundFX.click();
        window.print();
      });

      document.getElementById('profileArenaBtn').addEventListener('click', () => {
        SoundFX.click();
        navigate('arena');
      });

      document.getElementById('resetProgressBtn').addEventListener('click', () => {
        SoundFX.click();
        openModal(`
          <h2 id="modalTitle" style="font-size:1.35rem; margin-bottom:10px;">Reset All Progress?</h2>
          <p style="color:var(--text-muted); font-size:0.94rem; margin-bottom:22px;">
            This will clear all three game scores and your saved reflection note so you can start a fresh session.
          </p>
          <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn btn-secondary" id="modalCancelBtn" style="padding:10px 16px; min-height:40px;">CANCEL</button>
            <button class="btn btn-coral-outline" id="modalConfirmResetBtn" style="padding:10px 16px; min-height:40px;">YES, RESET</button>
          </div>
        `);
        document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
        document.getElementById('modalConfirmResetBtn').addEventListener('click', () => {
          AppState.persistent.scores = { election: null, detective: null, challenge: null };
          AppState.persistent.reflection = '';
          AppState.lastResult = null;
          saveState();
          closeModal();
          SoundFX.click();
          showToast('All scores have been reset.', 'warn');
          render();
        });
      });
    }

    // -------------------------------------------------------------------------
    // 7. GLOBAL NAVIGATION, PLAYER NAME MODAL & SOUND TOGGLE
    // -------------------------------------------------------------------------
    function bindGlobalControls() {
      document.getElementById('brandHomeBtn').addEventListener('click', () => {
        SoundFX.click();
        navigate('home');
      });

      document.querySelectorAll('.nav-link').forEach(btn => {
        btn.addEventListener('click', () => {
          SoundFX.click();
          navigate(btn.dataset.route);
        });
      });

      const mobileBtn = document.getElementById('mobileMenuBtn');
      const mobileDropdown = document.getElementById('mobileDropdown');
      mobileBtn.addEventListener('click', () => {
        SoundFX.click();
        const isOpen = mobileDropdown.classList.toggle('open');
        mobileBtn.setAttribute('aria-expanded', String(isOpen));
      });

      const soundBtn = document.getElementById('soundToggleBtn');
      soundBtn.addEventListener('click', () => {
        const on = SoundFX.toggle();
        soundBtn.classList.toggle('sound-on', on);
        soundBtn.title = `Sound Effects: ${on ? 'ON' : 'OFF'}`;
        document.getElementById('soundIcon').innerHTML = on
          ? `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>`
          : `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
        showToast(`Sound effects turned ${on ? 'ON' : 'OFF'}.`);
      });

      document.getElementById('playerBadgeBtn').addEventListener('click', () => {
        SoundFX.click();
        openModal(`
          <h2 id="modalTitle" style="font-size:1.35rem; margin-bottom:8px;">Player Identity</h2>
          <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:16px;">Enter your name or roll number for your Ethical Profile and printable Lab Report.</p>
          <label for="playerNameInput" class="field-label">Display Name</label>
          <input type="text" id="playerNameInput" class="text-input" maxlength="28" value="${escapeHTML(AppState.persistent.playerName)}" placeholder="e.g., Ananya Sharma" />
          <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
            <button class="btn btn-secondary" id="modalCancelName" style="padding:10px 16px; min-height:40px;">CANCEL</button>
            <button class="btn btn-primary" id="modalSaveName" style="padding:10px 18px; min-height:40px;">SAVE NAME</button>
          </div>
        `);
        document.getElementById('modalCancelName').addEventListener('click', closeModal);
        const saveName = () => {
          const val = document.getElementById('playerNameInput').value.trim();
          AppState.persistent.playerName = val ? val.toUpperCase() : 'PLAYER';
          saveState();
          updateNavUI();
          closeModal();
          SoundFX.correct();
          showToast(`Welcome, ${AppState.persistent.playerName}!`);
          if (AppState.route === 'profile') render();
        };
        document.getElementById('modalSaveName').addEventListener('click', saveName);
        document.getElementById('playerNameInput').addEventListener('keydown', e => {
          if (e.key === 'Enter') saveName();
        });
      });

      document.getElementById('modalBackdrop').addEventListener('click', e => {
        if (e.target.id === 'modalBackdrop') closeModal();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
      });
    }

    // Boot Application
    window.addEventListener('DOMContentLoaded', () => {
      bindGlobalControls();
      updateNavUI();
      render();
    });
  </script>
</body>
</html>
